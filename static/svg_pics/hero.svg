<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">TaskFlow — Your work. Your team. One flow.</title>
  <desc id="desc">A midnight navy product banner with task, meeting and project cards connected by a flowing violet line. The cards are illustrative.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#10172f"/>
      <stop offset="1" stop-color="#151431"/>
    </linearGradient>
    <radialGradient id="ambient" cx="85%" cy="35%" r="60%">
      <stop stop-color="#5546aa" stop-opacity=".24"/>
      <stop offset="1" stop-color="#5546aa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="flow" x2="1" y2="0">
      <stop stop-color="#818cf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#67d9d2" stop-opacity=".3"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="398" rx="24" fill="url(#background)" stroke="#303750"/>
  <rect x="2" y="2" width="1196" height="396" rx="23" fill="url(#ambient)"/>
  <path d="M614 0v400M654 0v400M694 0v400M734 0v400M774 0v400M814 0v400M854 0v400M894 0v400M934 0v400M974 0v400M1014 0v400M1054 0v400M1094 0v400M1134 0v400M1174 0v400M614 40h584M614 80h584M614 120h584M614 160h584M614 200h584M614 240h584M614 280h584M614 320h584M614 360h584" stroke="#bbc5ff" stroke-opacity=".035" fill="none"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="56" y="46" width="34" height="34" rx="10" fill="url(#accent)"/>
    <rect x="65" y="55" width="16" height="16" rx="4" stroke="#fff" stroke-width="1.6" fill="none"/>
    <path d="m69 63 3 3 6-7" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="106" y="68" fill="#b8c2de" font-size="13" font-weight="600" letter-spacing="2">TASKS. MEETINGS. PROJECTS.</text>
    <text x="53" y="192" fill="#f6f7ff" font-size="96" font-weight="750" letter-spacing="-5">Task<tspan fill="#a99aff">Flow</tspan></text>
    <text x="58" y="254" fill="#eef0ff" font-size="33" font-weight="500" letter-spacing="-.8">Your work. Your team.</text>
    <text x="58" y="299" fill="#9de5df" font-size="33" font-weight="500" letter-spacing="-.8">One flow.</text>
    <path d="M59 347h46" stroke="#9285f9" stroke-width="3" stroke-linecap="round"/>
    <text x="120" y="352" fill="#a5afca" font-size="13" letter-spacing="1.3">A WORKSPACE WITH PERSONALITY</text>
    <!-- Purposeful UI motifs, rather than a second application screenshot. -->
    <path d="M626 103c0-48 62-55 90-25s32 76 4 130-60 154 69 154h337" stroke="url(#flow)" stroke-width="2" fill="none"/>
    <rect x="713" y="91" width="430" height="258" rx="20" fill="#090f23" fill-opacity=".35"/>
    <rect x="703" y="79" width="430" height="258" rx="20" fill="#1a223d" stroke="#3b4564"/>
    <text x="730" y="117" fill="#eef0ff" font-size="19" font-weight="600">Your workspace</text>
    <path d="M728 134h379" stroke="#35405d"/>
    <rect x="728" y="151" width="32" height="32" rx="10" fill="#34305b"/>
    <path d="m737 167 5 5 10-11" stroke="#b7a8ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="775" y="163" fill="#eef0ff" font-size="17" font-weight="600">Break it into steps</text>
    <text x="775" y="184" fill="#aab6d1" font-size="14">Tasks · Priorities · Due dates</text>
    <rect x="728" y="213" width="32" height="32" rx="10" fill="#1e3b50"/>
    <rect x="737" y="222" width="14" height="14" rx="3" stroke="#8bd5f5" stroke-width="1.6" fill="none"/>
    <path d="M740 220v4m8-4v4m-11 4h14" stroke="#8bd5f5" stroke-width="1.6" stroke-linecap="round"/>
    <text x="775" y="225" fill="#eef0ff" font-size="17" font-weight="600">Make time to meet</text>
    <text x="775" y="246" fill="#aab6d1" font-size="14">Agendas · Maps · Meeting links</text>
    <rect x="728" y="275" width="32" height="32" rx="10" fill="#1d3b40"/>
    <circle cx="741" cy="285" r="3" stroke="#8cddd1" stroke-width="1.5" fill="none"/>
    <path d="M735 298v-3a6 6 0 0 1 12 0v3m1-16a3 3 0 0 1 0 6m3 10v-3a5 5 0 0 0-2-4" stroke="#8cddd1" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <text x="775" y="287" fill="#eef0ff" font-size="17" font-weight="600">Bring your people</text>
    <text x="775" y="308" fill="#aab6d1" font-size="14">Projects · Connection codes · Invites</text>
    <!-- A calendar tab gives the composition a small, playful interruption. -->
    <rect x="1043" y="39" width="68" height="79" rx="14" fill="#b3a4fa"/>
    <path d="M1043 63h68" stroke="#8b78dc"/>
    <path d="M1060 34v12m34-12v12" stroke="#e2dcff" stroke-width="4" stroke-linecap="round"/>
    <text x="1077" y="58" text-anchor="middle" fill="#30264f" font-size="10" font-weight="700" letter-spacing="1">TODAY</text>
    <path d="m1064 86 9 9 18-21" stroke="#30264f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
